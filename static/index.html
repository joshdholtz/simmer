<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>forward-sim</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/terminal.css">
</head>
<body>

<div id="app">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside id="sidebar">

    <div class="sidebar-logo">
      <span class="sidebar-logo-name">forward-sim</span>
      <span id="mode-badge" class="mode-badge">…</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Simulators</div>
      <label id="proj-filter-wrap" class="proj-filter">
        <input type="checkbox" id="proj-filter">
        <span>Project only</span>
      </label>
      <div id="device-list">
        <div class="device-list-empty">Loading…</div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-settings">
        <div class="ctrl-row">
          <span class="ctrl-label">FPS</span>
          <input type="range" id="fps-slider" class="ctrl-slider" min="5" max="30" value="15">
          <span id="fps-val" class="ctrl-value">15</span>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">Quality</span>
          <input type="range" id="qual-slider" class="ctrl-slider" min="20" max="95" value="70">
          <span id="qual-val" class="ctrl-value">70</span>
        </div>
        <button id="ds-btn" class="sidebar-btn">Data Saver</button>
      </div>
      <button id="btn-refresh" class="sidebar-btn">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10a6.5 6.5 0 1 0 6.5-6.5H7"/><path d="M7 1.5v4H3"/></svg>
        Refresh
      </button>
    </div>

  </aside>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <main id="main">

    <!-- Empty state -->
    <div id="empty-state">
      <div class="empty-icon">📱</div>
      <div class="empty-title">No simulator selected</div>
      <div class="empty-sub">Choose a device from the sidebar</div>
    </div>

    <!-- Simulator viewport -->
    <div id="viewport-wrap" class="hidden">
      <div id="device-frame">
        <canvas id="screen"></canvas>
        <div id="connect-overlay">
          <div class="spinner"></div>
          <span>Connecting…</span>
        </div>
      </div>
    </div>

    <!-- Floating controls pill -->
    <div id="controls-pill" class="hidden">
      <button class="pill-btn" id="btn-rotate" title="Rotate left">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10a6.5 6.5 0 1 0 6.5-6.5H7"/><path d="M7 1.5v4H3"/></svg>
      </button>
      <div class="pill-sep"></div>
      <button class="pill-btn" id="btn-home" title="Home button">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"/><rect x="6.5" y="6.5" width="7" height="7" rx="2.5"/></svg>
      </button>
      <div class="pill-sep"></div>
      <button class="pill-btn" id="btn-appear" title="Switch to light">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3.5a6.5 6.5 0 0 0 0 13A7.5 7.5 0 0 1 10 3.5z"/></svg>
      </button>
      <div class="pill-sep"></div>
      <button class="pill-btn" id="btn-kbd" title="Keyboard input">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="16" height="10" rx="2.5"/><path d="M5.5 10h.5M8.5 10H9M12 10h.5M15 10h.5M5.5 13H14.5"/></svg>
      </button>
      <div class="pill-sep"></div>
      <button class="pill-btn" id="btn-terminal" title="Terminal">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l4 3-4 3"/><path d="M11 13h5"/></svg>
      </button>
      <div class="pill-sep"></div>
      <div id="status-dot" class="status-dot" style="margin: 0 6px;"></div>
    </div>

  </main>
</div>

<!-- ── Terminal drawer ───────────────────────────────────────────────────── -->
<div id="terminal-drawer">
  <div class="drawer-handle">
    <div class="drawer-grip"></div>
    <span class="drawer-title">Terminal</span>
    <div class="drawer-status">
      <div id="term-status-dot" class="status-dot"></div>
    </div>
    <button id="btn-close-term" class="drawer-close">×</button>
  </div>
  <div id="term-el"></div>
</div>

<!-- ── Keyboard bar ──────────────────────────────────────────────────────── -->
<div id="kbd-bar">
  <input id="kbd-input" class="kbd-input" type="text"
         placeholder="Type to send…"
         autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
  <button id="kbd-bs"  class="kbd-key" title="Backspace">⌫</button>
  <button id="kbd-ret" class="kbd-key" title="Return">↵</button>
  <button id="kbd-send" class="kbd-send">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
