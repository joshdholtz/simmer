<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>forward-sim</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #111; color: #eee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100dvh; overflow: hidden; }

/* ── Launcher ── */
#launcher { padding: 24px; padding-top: calc(24px + env(safe-area-inset-top)); height: 100dvh; overflow-y: auto; }
#launcher h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: #555; font-size: 14px; margin-bottom: 20px; }
#launcher-actions { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.action-btn { background: #0a84ff; color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-size: 15px; font-weight: 500; cursor: pointer; }
.action-btn.sec { background: #2c2c2e; color: #eee; }
.action-btn:active { opacity: 0.7; }
#proj-filter-label { display: none; align-items: center; gap: 6px; font-size: 13px; color: #888; cursor: pointer; }
#proj-filter-label.visible { display: flex; }
#proj-filter-label input { accent-color: #32d74b; }
.sim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.sim-card { background: #1c1c1e; border-radius: 16px; padding: 20px 14px; cursor: pointer; user-select: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; transition: background 0.12s; }
.sim-card:active { background: #2c2c2e; }
.sim-card.project { border: 1.5px solid #1a5c1a; }
.sim-card .icon { font-size: 42px; }
.sim-card .name { font-size: 13px; font-weight: 500; line-height: 1.3; }
.sim-card .dims { font-size: 11px; color: #555; }
.sim-card .open-tab-btn { position: absolute; top: 10px; right: 10px; font-size: 12px; color: #0a84ff; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
@media (hover: hover) { .sim-card:hover .open-tab-btn { opacity: 1; pointer-events: auto; } }
.proj-badge { position: absolute; top: 8px; left: 8px; font-size: 9px; font-weight: 700; color: #32d74b; background: #0a3d0a; padding: 2px 6px; border-radius: 4px; }
.empty { text-align: center; color: #444; padding: 60px 0; grid-column: 1/-1; font-size: 14px; }
#mode-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-left: 8px; vertical-align: middle; background: #2c2c2e; color: #888; }
#mode-badge.fast { background: #0a3d0a; color: #32d74b; }
#mode-badge.compat { background: #3d2a00; color: #ff9f0a; }

/* ── Workspace ── */
#workspace { display: none; flex-direction: column; height: 100dvh; }
#workspace.active { display: flex; }

/* Tab bar */
#tab-bar { display: flex; align-items: center; background: #1c1c1e; border-bottom: 1px solid #2c2c2e; padding-top: env(safe-area-inset-top); flex-shrink: 0; height: calc(44px + env(safe-area-inset-top)); }
#tab-back-btn { background: none; border: none; color: #0a84ff; font-size: 20px; cursor: pointer; padding: 0 14px; flex-shrink: 0; height: 44px; display: flex; align-items: center; }
#tab-back-btn:active { opacity: 0.6; }
#tab-list { flex: 1; display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 0 4px; height: 44px; scrollbar-width: none; }
#tab-list::-webkit-scrollbar { display: none; }
.tab-pill { display: flex; align-items: center; gap: 6px; background: #2c2c2e; border-radius: 8px; padding: 5px 8px 5px 12px; cursor: pointer; flex-shrink: 0; font-size: 13px; color: #888; max-width: 200px; }
.tab-pill.active { background: #3a3a3c; color: #eee; }
.tab-pill:active { opacity: 0.7; }
.tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
.tab-close { background: none; border: none; color: #555; font-size: 16px; line-height: 1; cursor: pointer; padding: 2px; flex-shrink: 0; }
.tab-close:active { color: #eee; }
#new-term-btn { background: none; border: none; color: #0a84ff; font-size: 24px; cursor: pointer; padding: 0 14px; flex-shrink: 0; height: 44px; display: flex; align-items: center; }
#new-term-btn:active { opacity: 0.6; }

/* Pane container */
#pane-container { flex: 1; min-height: 0; position: relative; }

/* ── Split layout ── */
.tab-pane { position: absolute; inset: 0; display: flex; }
.split-h { display: flex; flex-direction: row; flex: 1; min-width: 0; min-height: 0; }
.split-v { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
/* Borders between split siblings */
.split-h > * + * { border-left: 1px solid #111; }
.split-v > * + * { border-top: 1px solid #111; }

/* ── Pane ── */
.pane { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.pane.fullscreen { position: absolute; inset: 0; z-index: 100; }

/* Pane header */
.pane-header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 10px; background: #1c1c1e; border-bottom: 1px solid #2c2c2e; flex-shrink: 0; height: 38px; gap: 4px; }
.pane-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.pane-actions { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
.pane-btn { background: none; border: none; color: #555; font-size: 15px; cursor: pointer; padding: 4px 6px; border-radius: 5px; line-height: 1; flex-shrink: 0; }
.pane-btn:active { background: #3a3a3c; color: #eee; }
.pane-split-btn { color: #0a84ff; font-size: 13px; font-weight: 600; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #3a3a3c; flex-shrink: 0; margin-right: 2px; }
.status-dot.connected { background: #32d74b; }
.status-dot.reconnecting { background: #ff9f0a; }

/* Sim pane */
.pane-canvas-wrap { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
.pane-canvas-wrap canvas { width: auto; height: auto; max-width: 100%; max-height: 100%; touch-action: none; display: block; cursor: crosshair; }
.pane-footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 12px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); background: #1c1c1e; flex-shrink: 0; }
.pane.kbd-open .pane-footer { padding-bottom: 6px; }
.pane-kbd-bar { display: none; align-items: center; gap: 8px; padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); background: #1c1c1e; border-top: 1px solid #2c2c2e; flex-shrink: 0; }
.pane-kbd-bar.open { display: flex; }
.pane-kbd-input { flex: 1; background: #2c2c2e; border: none; border-radius: 10px; color: #eee; font-size: 16px; padding: 8px 12px; outline: none; min-width: 0; }
.pane-kbd-input::placeholder { color: #555; }
.pane-kbd-key { background: #2c2c2e; border: none; border-radius: 8px; color: #eee; font-size: 15px; padding: 7px 11px; cursor: pointer; flex-shrink: 0; }
.pane-kbd-key:active { background: #3a3a3c; }
.pane-kbd-send { background: #0a84ff; border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 600; padding: 8px 14px; cursor: pointer; flex-shrink: 0; }
.pane-kbd-send:active { opacity: 0.7; }
.ctrl { display: flex; align-items: center; gap: 6px; color: #888; font-size: 11px; }
.ctrl label { width: 44px; }
.ctrl input[type=range] { width: 70px; accent-color: #0a84ff; }
.ctrl span { width: 22px; text-align: right; color: #ccc; font-size: 11px; font-variant-numeric: tabular-nums; }
.dsaver-btn { background: #2c2c2e; border: none; color: #888; border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer; }
.dsaver-btn.on { background: #0a3d0a; color: #32d74b; }
.kbd-btn { background: #2c2c2e; border: none; color: #eee; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; margin-left: auto; }
.dsaver-btn:active, .kbd-btn:active { opacity: 0.7; }
.kbd-btn.on { background: #0a3d0a; color: #32d74b; }

/* Connecting overlay */
.connecting-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #888; font-size: 14px; text-align: center; padding: 24px; }
.connecting-overlay.hidden { display: none; }
.connecting-overlay code { background: #2c2c2e; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #eee; }
.spinner { width: 28px; height: 28px; border: 3px solid #333; border-top-color: #0a84ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Terminal pane */
.pane-terminal { flex: 1; min-height: 0; background: #000; overflow: hidden; padding-bottom: env(safe-area-inset-bottom); }
.pane-terminal .xterm { height: 100%; }

/* Picker pane */
.pane-picker { flex: 1; min-height: 0; overflow-y: auto; background: #111; }
.picker-list { padding: 8px 0; }
.picker-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid #1c1c1e; cursor: pointer; }
.picker-item:active { background: #1c1c1e; }
.picker-item .picon { font-size: 28px; flex-shrink: 0; }
.picker-item .pname { font-size: 15px; font-weight: 500; }
.picker-item .psub { font-size: 12px; color: #555; margin-top: 2px; }
</style>
</head>
<body>

<!-- ═══════════════ LAUNCHER ═══════════════ -->
<div id="launcher">
  <h1>forward-sim<span id="mode-badge">…</span></h1>
  <p class="subtitle">Tap a simulator to open it</p>
  <div id="launcher-actions">
    <button class="action-btn" onclick="loadSims()">⟳ Refresh</button>
    <button class="action-btn sec" onclick="openTermTab()">⌨ Terminal</button>
    <label id="proj-filter-label">
      <input type="checkbox" id="proj-filter" onchange="renderSimGrid()">
      <span id="proj-filter-text">Project only</span>
    </label>
  </div>
  <div id="sim-grid" class="sim-grid"><div class="empty">⏳ Loading…</div></div>
</div>

<!-- ═══════════════ WORKSPACE ═══════════════ -->
<div id="workspace">
  <div id="tab-bar">
    <button id="tab-back-btn" onclick="goToLauncher()">⌂</button>
    <div id="tab-list"></div>
    <button id="new-term-btn" onclick="openTermTab()" title="New terminal tab">+</button>
  </div>
  <div id="pane-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
// ══════════════════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════════════════
function _mkBtn(text, title2, extraClass = '') {
  const b = document.createElement('button');
  b.className = 'pane-btn' + (extraClass ? ' ' + extraClass : '');
  b.textContent = text; b.title = title2;
  return b;
}

// ══════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════
let allSims = [];
let tabs = [];       // [{id, label, wrapper}]
let activeTabId = null;
let termCount = 0;
const _pd = new WeakMap(); // pane el → {type, label, cleanup, fitAddon, forceReconnect}

// ══════════════════════════════════════════════════════════
// Launcher
// ══════════════════════════════════════════════════════════
async function loadSims() {
  const grid = document.getElementById('sim-grid');
  grid.innerHTML = '<div class="empty">⏳ Scanning…</div>';
  try {
    const abort = new AbortController();
    const t = setTimeout(() => abort.abort(), 8000);
    const [sims, info] = await Promise.all([
      fetch('/api/sims', { signal: abort.signal }).then(r => r.json()),
      fetch('/api/info', { signal: abort.signal }).then(r => r.json()).catch(() => ({})),
    ]).finally(() => clearTimeout(t));
    allSims = sims;
    const badge = document.getElementById('mode-badge');
    if (info.mode) { const f = info.mode.startsWith('fast'); badge.textContent = f ? 'fast' : 'compat'; badge.className = f ? 'fast' : 'compat'; }
    const lbl = document.getElementById('proj-filter-label');
    if (info.bundle_id) { lbl.classList.add('visible'); document.getElementById('proj-filter-text').textContent = info.bundle_id.split('.').pop() + ' only'; }
    else lbl.classList.remove('visible');
    renderSimGrid();
  } catch { grid.innerHTML = '<div class="empty">⚠️ Could not reach server.</div>'; }
}

function renderSimGrid() {
  const grid = document.getElementById('sim-grid');
  const filterOn = document.getElementById('proj-filter').checked;
  const sims = filterOn ? allSims.filter(s => s.project_app) : allSims;
  if (!sims.length) { grid.innerHTML = `<div class="empty">${filterOn ? '📱 No project simulators.' : '📱 No simulators running.'}</div>`; return; }
  grid.innerHTML = sims.map(s => `
    <div class="sim-card${s.project_app ? ' project' : ''}" onclick="openSimTab('${s.id}','${esc(s.name)}',${s.width},${s.height})">
      <span class="open-tab-btn" onclick="openSimNewWindow(event,'${s.id}','${esc(s.name)}',${s.width},${s.height})">↗</span>
      ${s.project_app ? '<span class="proj-badge">★ project</span>' : ''}
      <div class="icon">${simIcon(s.name)}</div>
      <div class="name">${esc(s.name)}</div>
      <div class="dims">${s.width}×${s.height}</div>
    </div>`).join('');
}

function openSimNewWindow(e, id, name, w, h) {
  e.stopPropagation();
  const url = new URL(location.href);
  url.searchParams.set('view', id); url.searchParams.set('name', name);
  url.searchParams.set('w', w); url.searchParams.set('h', h);
  window.open(url.toString(), '_blank');
}

// ══════════════════════════════════════════════════════════
// View switching
// ══════════════════════════════════════════════════════════
function showWorkspace() {
  document.getElementById('launcher').style.display = 'none';
  document.getElementById('workspace').classList.add('active');
}
function goToLauncher() {
  document.getElementById('workspace').classList.remove('active');
  document.getElementById('launcher').style.display = '';
}

// ══════════════════════════════════════════════════════════
// Tab management
// ══════════════════════════════════════════════════════════
function _newTab(label) {
  const id = 'tab-' + Date.now() + Math.random().toString(36).slice(2);
  const wrapper = document.createElement('div');
  wrapper.className = 'tab-pane';
  document.getElementById('pane-container').appendChild(wrapper);
  const tabObj = { id, label, wrapper };
  tabs.push(tabObj);
  return tabObj;
}

function renderTabs() {
  const list = document.getElementById('tab-list');
  list.innerHTML = tabs.map(t => `
    <div class="tab-pill${t.id === activeTabId ? ' active' : ''}" onclick="activateTab('${t.id}')">
      <span class="tab-label">${esc(t.label)}</span>
      <button class="tab-close" onclick="closeTab(event,'${t.id}')">×</button>
    </div>`).join('');
  const pill = list.querySelector('.tab-pill.active');
  if (pill) pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}

function activateTab(id) {
  activeTabId = id;
  tabs.forEach(t => {
    const visible = t.id === id;
    t.wrapper.style.display = visible ? '' : 'none';
    if (visible) _refitTerminals(t.wrapper);
  });
  renderTabs();
}

function closeTab(e, id) {
  e?.stopPropagation();
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  tabs[idx].wrapper.querySelectorAll('.pane').forEach(p => _pd.get(p)?.cleanup?.());
  tabs[idx].wrapper.remove();
  tabs.splice(idx, 1);
  if (!tabs.length) { goToLauncher(); return; }
  activateTab(tabs[Math.min(idx, tabs.length - 1)].id);
}

function _tabLabel(tabObj) {
  const labels = [];
  tabObj.wrapper.querySelectorAll('.pane').forEach(p => {
    const d = _pd.get(p);
    if (d?.label && d.type !== 'picker') labels.push(d.label);
  });
  return labels.join(' · ') || 'Tab';
}

function _refitTerminals(el) {
  setTimeout(() => {
    el.querySelectorAll('.pane').forEach(p => _pd.get(p)?.fitAddon?.fit());
  }, 20);
}

// ══════════════════════════════════════════════════════════
// Pane tree — split and close
// ══════════════════════════════════════════════════════════
function _makePane() {
  const p = document.createElement('div');
  p.className = 'pane';
  return p;
}

function splitPane(pane, direction) {
  const container = document.createElement('div');
  container.className = direction === 'h' ? 'split-h' : 'split-v';
  pane.parentNode.replaceChild(container, pane);
  container.appendChild(pane);
  const newPane = _makePane();
  container.appendChild(newPane);
  const tabObj = tabs.find(t => t.id === activeTabId);
  _buildPickerContent(newPane, tabObj);
  _refitTerminals(container);
}

function closePane(pane) {
  _pd.get(pane)?.cleanup?.();
  const parent = pane.parentNode;
  // Root pane — close the whole tab
  if (parent.classList.contains('tab-pane')) { closeTab(null, activeTabId); return; }
  // Collapse split: promote the sibling into the grandparent
  const sibling = Array.from(parent.children).find(c => c !== pane);
  parent.parentNode.replaceChild(sibling, parent);
  const tabObj = tabs.find(t => t.id === activeTabId);
  if (tabObj) { tabObj.label = _tabLabel(tabObj); renderTabs(); }
  _refitTerminals(sibling.parentNode ?? sibling);
}

// ══════════════════════════════════════════════════════════
// Pane header builder
// ══════════════════════════════════════════════════════════
function _makeHeader(pane, tabObj, title, leftExtra = []) {
  const hdr = document.createElement('div');
  hdr.className = 'pane-header';

  const left = document.createElement('div');
  left.className = 'pane-title'; // reuse class as flex container
  left.style.cssText = 'display:flex;align-items:center;gap:6px;flex:1;overflow:hidden;';
  leftExtra.forEach(el => left.appendChild(el));
  const titleEl = document.createElement('span');
  titleEl.className = 'pane-title';
  titleEl.textContent = title;
  left.appendChild(titleEl);
  hdr.appendChild(left);

  const actions = document.createElement('div');
  actions.className = 'pane-actions';

  const splitR = _mkBtn('→', 'Split right', 'pane-split-btn');
  splitR.onclick = () => splitPane(pane, 'h');
  const splitD = _mkBtn('↓', 'Split down', 'pane-split-btn');
  splitD.onclick = () => splitPane(pane, 'v');

  const fsBtn = _mkBtn('⛶', 'Full screen');
  fsBtn.onclick = () => {
    const entering = !pane.classList.contains('fullscreen');
    pane.classList.toggle('fullscreen', entering);
    fsBtn.textContent = entering ? '⊠' : '⛶';
    if (entering) _refitTerminals(pane);
  };

  const closeBtn = _mkBtn('×', 'Close pane');
  closeBtn.onclick = () => closePane(pane);

  actions.append(splitR, splitD, fsBtn, closeBtn);
  hdr.appendChild(actions);
  return { hdr, titleEl };
}

// ══════════════════════════════════════════════════════════
// Open tabs
// ══════════════════════════════════════════════════════════
function openSimTab(id, name, w, h) {
  for (const t of tabs) {
    const found = [...t.wrapper.querySelectorAll('.pane')].find(p => {
      const d = _pd.get(p); return d?.type === 'sim' && d.simId === id;
    });
    if (found) { activateTab(t.id); showWorkspace(); return; }
  }
  const tabObj = _newTab(name);
  const pane = _makePane();
  tabObj.wrapper.appendChild(pane);
  _buildSimContent(pane, tabObj, id, name, w, h);
  renderTabs(); activateTab(tabObj.id); showWorkspace();
}

function openTermTab() {
  termCount++;
  const label = termCount === 1 ? 'zsh' : 'zsh ' + termCount;
  const tabObj = _newTab(label);
  const pane = _makePane();
  tabObj.wrapper.appendChild(pane);
  _buildTermContent(pane, tabObj);
  renderTabs(); activateTab(tabObj.id); showWorkspace();
}

// ══════════════════════════════════════════════════════════
// Sim pane
// ══════════════════════════════════════════════════════════
function _buildSimContent(pane, tabObj, simId, name, w, h) {
  const data = { type: 'sim', simId, label: name, cleanup: null, forceReconnect: null };
  _pd.set(pane, data);

  let appearMode = 'dark';
  const dot = document.createElement('div'); dot.className = 'status-dot';
  const homeBtn   = _mkBtn('⌂', 'Home');
  const rotateBtn = _mkBtn('Rot', 'Rotate');
  const appearBtn = _mkBtn('🌙', 'Toggle appearance');
  const { hdr } = _makeHeader(pane, tabObj, name, [homeBtn, rotateBtn, appearBtn, dot]);
  pane.appendChild(hdr);

  const wrap = document.createElement('div'); wrap.className = 'pane-canvas-wrap';
  const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  const overlay = document.createElement('div'); overlay.className = 'connecting-overlay';
  overlay.innerHTML = '<div class="spinner"></div><span>Connecting…</span>';
  wrap.append(canvas, overlay);
  pane.appendChild(wrap);

  const footer = document.createElement('div'); footer.className = 'pane-footer';
  footer.innerHTML = `
    <div class="ctrl"><label>FPS</label><input type="range" min="5" max="30" value="15"><span>15</span></div>
    <div class="ctrl"><label>Quality</label><input type="range" min="20" max="95" value="70"><span>70</span></div>
    <button class="dsaver-btn">Data Saver</button>
    <button class="kbd-btn">⌨</button>`;
  pane.appendChild(footer);

  const kbdBar = document.createElement('div'); kbdBar.className = 'pane-kbd-bar';
  kbdBar.innerHTML = `<input class="pane-kbd-input" type="text" placeholder="Type to send…" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
    <button class="pane-kbd-key" title="Backspace">⌫</button>
    <button class="pane-kbd-key" title="Return">↵</button>
    <button class="pane-kbd-send">Send</button>`;
  pane.appendChild(kbdBar);

  const ctx = canvas.getContext('2d');
  const [fpsCtrl, qualCtrl] = footer.querySelectorAll('.ctrl');
  const fpsSlider = fpsCtrl.querySelector('input'), fpsVal = fpsCtrl.querySelector('span');
  const qualSlider = qualCtrl.querySelector('input'), qualVal = qualCtrl.querySelector('span');
  const dsBtn = footer.querySelector('.dsaver-btn');
  const kbdBtn = footer.querySelector('.kbd-btn');
  const kbdInput = kbdBar.querySelector('.pane-kbd-input');
  const [bsBtn, retBtn, sendBtn] = kbdBar.querySelectorAll('button');
  let dataSaverOn = false, ws = null, reconnectTimer = null, watchdog = null, lastFrameAt = 0;
  // portrait baseline — always swap from these so we don't drift across multiple rotations
  const portraitW = Math.min(w, h), portraitH = Math.max(w, h);
  let isLandscape = false;

  function setOrientation(landscape) {
    if (landscape === isLandscape) return;
    isLandscape = landscape;
    canvas.width  = isLandscape ? portraitH : portraitW;
    canvas.height = isLandscape ? portraitW : portraitH;
    sendMsg({ type: 'settings', dev_w: canvas.width, dev_h: canvas.height });
  }

  function sendMsg(obj) { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

  homeBtn.onclick   = () => sendMsg({ type: 'home' });
  rotateBtn.onclick = () => sendMsg({ type: 'rotate' });
  appearBtn.onclick = () => {
    appearMode = appearMode === 'dark' ? 'light' : 'dark';
    appearBtn.textContent = appearMode === 'dark' ? '🌙' : '☀';
    sendMsg({ type: 'appearance', mode: appearMode });
  };

  fpsSlider.oninput = qualSlider.oninput = () => {
    fpsVal.textContent = fpsSlider.value; qualVal.textContent = qualSlider.value;
    sendMsg({ type: 'settings', fps: +fpsSlider.value, quality: +qualSlider.value });
  };
  dsBtn.onclick = () => {
    dataSaverOn = !dataSaverOn; dsBtn.classList.toggle('on', dataSaverOn);
    dsBtn.textContent = dataSaverOn ? 'Data Saver ON' : 'Data Saver';
    sendMsg({ type: 'settings', data_saver: dataSaverOn });
  };

  function sendKbdText() {
    const t = kbdInput.value; if (!t) return;
    sendMsg({ type: 'text', text: t }); kbdInput.value = ''; kbdInput.focus();
  }
  sendBtn.onclick = sendKbdText;
  kbdInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendKbdText(); } });
  bsBtn.onclick = () => sendMsg({ type: 'key', key: 'backspace' });
  retBtn.onclick = () => sendMsg({ type: 'key', key: 'return' });
  kbdBtn.onclick = () => {
    const open = kbdBar.classList.toggle('open');
    pane.classList.toggle('kbd-open', open);
    kbdBtn.classList.toggle('on', open);
    if (open) kbdInput.focus();
  };

  let touchOrigin = null;
  const THRESH = 0.015;
  function normCoords(e) {
    const r = canvas.getBoundingClientRect();
    return { x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) };
  }
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); touchOrigin = normCoords(e); }, { passive: false });
  canvas.addEventListener('pointerup', e => {
    e.preventDefault(); if (!touchOrigin) return;
    const end = normCoords(e), dx = end.x - touchOrigin.x, dy = end.y - touchOrigin.y;
    if (Math.sqrt(dx*dx + dy*dy) < THRESH) sendMsg({ type: 'tap', x: end.x, y: end.y });
    else sendMsg({ type: 'drag', x1: touchOrigin.x, y1: touchOrigin.y, x2: end.x, y2: end.y });
    touchOrigin = null;
  }, { passive: false });
  canvas.addEventListener('pointercancel', () => { touchOrigin = null; });

  let connectTimer = null;

  function connect() {
    clearTimeout(connectTimer);
    clearTimeout(reconnectTimer);
    if (ws) { ws.onclose = null; ws.close(); }
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/${simId}?fps=${fpsSlider.value}&quality=${qualSlider.value}`);
    ws.binaryType = 'blob';
    dot.className = 'status-dot reconnecting';
    overlay.classList.remove('hidden'); overlay.querySelector('span').textContent = 'Connecting…';
    let firstFrame = false, noSignalTimer = null;

    // If WS stays in CONNECTING for 5s, force a retry
    connectTimer = setTimeout(() => {
      if (ws?.readyState === WebSocket.CONNECTING) { ws.onclose = null; ws.close(); reconnectTimer = setTimeout(connect, 1000); }
    }, 5000);

    ws.onopen = () => {
      clearTimeout(connectTimer);
      dot.className = 'status-dot connected'; overlay.classList.add('hidden'); lastFrameAt = Date.now();
      noSignalTimer = setTimeout(() => {
        if (!firstFrame) { overlay.classList.remove('hidden'); overlay.querySelector('span').innerHTML = 'No frames.<br>Grant Screen Recording or use <code>--mode compat</code>'; }
      }, 4000);
    };
    ws.onclose = () => {
      clearTimeout(connectTimer); clearTimeout(noSignalTimer); dot.className = 'status-dot';
      if (document.contains(pane)) {
        dot.className = 'status-dot reconnecting'; overlay.classList.remove('hidden');
        overlay.querySelector('span').textContent = 'Reconnecting…';
        reconnectTimer = setTimeout(connect, 2000);
      }
    };
    ws.onerror = () => ws.close();
    let frameInFlight = false;
    ws.onmessage = e => {
      if (typeof e.data === 'string') {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'rotated') {
            // Early layout hint — frame auto-detection below will confirm/correct.
            setOrientation(!isLandscape);
          }
        } catch {}
        return;
      }
      if (!(e.data instanceof Blob)) return;
      lastFrameAt = Date.now();
      if (!firstFrame) { firstFrame = true; clearTimeout(noSignalTimer); overlay.classList.add('hidden'); }
      if (frameInFlight) return;
      frameInFlight = true;
      const url = URL.createObjectURL(e.data);
      const img = new Image();
      img.onload = () => {
        // Detect orientation from actual JPEG dimensions — self-corrects any toggle drift.
        setOrientation(img.naturalWidth > img.naturalHeight);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        frameInFlight = false;
      };
      img.onerror = () => { URL.revokeObjectURL(url); frameInFlight = false; };
      img.src = url;
    };
    clearInterval(watchdog);
    watchdog = setInterval(() => {
      if (ws?.readyState === WebSocket.OPEN && lastFrameAt > 0 && Date.now() - lastFrameAt > 8000) connect();
    }, 3000);
  }
  connect();
  data.forceReconnect = () => { clearTimeout(reconnectTimer); clearTimeout(connectTimer); connect(); };
  data.cleanup = () => { clearInterval(watchdog); clearTimeout(reconnectTimer); clearTimeout(connectTimer); if (ws) { ws.onclose = null; ws.close(); } };

  tabObj.label = _tabLabel(tabObj); renderTabs();
}

// ══════════════════════════════════════════════════════════
// Terminal pane
// ══════════════════════════════════════════════════════════
function _buildTermContent(pane, tabObj) {
  const data = { type: 'terminal', label: 'zsh', cleanup: null, fitAddon: null, forceReconnect: null };
  _pd.set(pane, data);

  const { hdr } = _makeHeader(pane, tabObj, 'Terminal');
  pane.appendChild(hdr);

  const termEl = document.createElement('div'); termEl.className = 'pane-terminal';
  pane.appendChild(termEl);

  const term = new Terminal({
    fontFamily: 'Menlo, Monaco, "Courier New", monospace', fontSize: 14,
    theme: { background: '#000000', foreground: '#d4d4d4', cursor: '#d4d4d4', selectionBackground: '#264f78' },
    cursorBlink: true, scrollback: 10000, allowProposedApi: true,
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon); term.open(termEl);
  data.fitAddon = fitAddon;
  setTimeout(() => fitAddon.fit(), 20);

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let wsRef = null, termConnectTimer = null, termReconnectTimer = null;
  let sessionId = null;  // assigned by server; reused on reconnect to resume the same shell
  let closing = false;   // true when the pane is intentionally closed

  function connectTerm() {
    clearTimeout(termConnectTimer);
    clearTimeout(termReconnectTimer);
    if (wsRef) { wsRef.onclose = null; wsRef.close(); wsRef = null; }
    const url = `${proto}//${location.host}/ws/pty${sessionId ? '?session=' + sessionId : ''}`;
    const ws = new WebSocket(url);
    wsRef = ws; ws.binaryType = 'arraybuffer';
    termConnectTimer = setTimeout(() => {
      if (ws.readyState === WebSocket.CONNECTING) { ws.onclose = null; ws.close(); wsRef = null; termReconnectTimer = setTimeout(connectTerm, 1000); }
    }, 8000);
    ws.onopen = () => {
      clearTimeout(termConnectTimer);
      fitAddon.fit();
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };
    ws.onclose = () => {
      clearTimeout(termConnectTimer);
      if (closing) return;
      if (wsRef === ws) { wsRef = null; termReconnectTimer = setTimeout(connectTerm, 1500); }
    };
    ws.onerror = () => ws.close();
    ws.onmessage = e => {
      if (e.data instanceof ArrayBuffer) {
        term.write(new Uint8Array(e.data));
      } else {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'session') sessionId = msg.id;
        } catch {}
      }
    };
  }
  term.onData(d => { if (wsRef?.readyState === WebSocket.OPEN) wsRef.send(new TextEncoder().encode(d)); });
  term.onResize(({ cols, rows }) => { if (wsRef?.readyState === WebSocket.OPEN) wsRef.send(JSON.stringify({ type: 'resize', cols, rows })); });

  const ro = new ResizeObserver(() => { if (activeTabId === tabObj.id) fitAddon.fit(); });
  ro.observe(termEl);

  connectTerm();
  data.forceReconnect = () => connectTerm();
  data.cleanup = () => { closing = true; ro.disconnect(); clearTimeout(termReconnectTimer); if (wsRef) { wsRef.onclose = null; wsRef.close(); } term.dispose(); };

  tabObj.label = _tabLabel(tabObj); renderTabs();
}

// ══════════════════════════════════════════════════════════
// Picker pane — shown in the empty half after a split
// ══════════════════════════════════════════════════════════
function _buildPickerContent(pane, tabObj) {
  _pd.set(pane, { type: 'picker', label: '', cleanup: null });

  const hdr = document.createElement('div'); hdr.className = 'pane-header';
  const titleEl = document.createElement('span'); titleEl.className = 'pane-title'; titleEl.style.color = '#666'; titleEl.textContent = 'Choose…';
  const actions = document.createElement('div'); actions.className = 'pane-actions';
  const closeBtn = document.createElement('button'); closeBtn.className = 'pane-btn'; closeBtn.textContent = '×'; closeBtn.title = 'Close pane';
  closeBtn.onclick = () => closePane(pane);
  actions.appendChild(closeBtn);
  hdr.append(titleEl, actions);
  pane.appendChild(hdr);

  const picker = document.createElement('div'); picker.className = 'pane-picker';
  const list = document.createElement('div'); list.className = 'picker-list';

  function pick(buildFn) {
    pane.innerHTML = '';
    _pd.set(pane, { type: 'picker', label: '', cleanup: null }); // reset before build
    buildFn(pane, tabObj);
  }

  const termItem = document.createElement('div'); termItem.className = 'picker-item';
  termItem.innerHTML = `<span class="picon">⌨</span><div><div class="pname">Terminal</div><div class="psub">New zsh session</div></div>`;
  termItem.onclick = () => pick(_buildTermContent);
  list.appendChild(termItem);

  allSims.forEach(s => {
    const item = document.createElement('div'); item.className = 'picker-item';
    item.innerHTML = `<span class="picon">${simIcon(s.name)}</span><div><div class="pname">${esc(s.name)}</div><div class="psub">${s.width}×${s.height}</div></div>`;
    item.onclick = () => pick((p, t) => _buildSimContent(p, t, s.id, s.name, s.width, s.height));
    list.appendChild(item);
  });

  if (!allSims.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:24px;color:#555;text-align:center;font-size:13px';
    empty.textContent = 'No simulators running';
    list.appendChild(empty);
  }

  picker.appendChild(list);
  pane.appendChild(picker);
}

// ══════════════════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════════════════
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function simIcon(name) {
  const n = name.toLowerCase();
  if (n.includes('ipad')) return '⬜';
  if (n.includes('apple tv')) return '📺';
  if (n.includes('watch')) return '⌚';
  if (n.includes('mac')) return '🖥';
  return '📱';
}

// ══════════════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════════════
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  tabs.forEach(t => t.wrapper.querySelectorAll('.pane').forEach(p => _pd.get(p)?.forceReconnect?.()));
});

window.addEventListener('popstate', e => {
  if (e.state?.id) openSimTab(e.state.id, e.state.name, e.state.w, e.state.h);
  else goToLauncher();
});

(function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('view');
  if (id) openSimTab(id, params.get('name') || 'Simulator', parseInt(params.get('w') || '390'), parseInt(params.get('h') || '844'));
  else loadSims();
})();
</script>
