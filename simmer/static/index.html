<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>simmer</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/terminal.css">
  <script>
    // Heal broken saved state: pinned=true + open=false hides the terminal button forever
    try {
      var _s = JSON.parse(localStorage.getItem('simmerSession') || '{}');
      if (_s.termPinned && !_s.termOpen) { delete _s.termPinned; localStorage.setItem('simmerSession', JSON.stringify(_s)); }
    } catch(e) {}
  </script>
</head>
<body>

<div id="app">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <span class="sidebar-logo-name">simmer</span>
      <span id="mode-badge" class="mode-badge">…</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label-row">
        <span class="sidebar-label">Simulators</span>
        <button id="add-sim-btn" class="add-sim-btn" title="Add simulator">+</button>
      </div>
      <label id="proj-filter-wrap" class="proj-filter">
        <input type="checkbox" id="proj-filter">
        <span>Project only</span>
      </label>
      <div id="device-list">
        <div class="device-list-empty">Loading…</div>
      </div>
    </div>

    <!-- Add simulator popover (slides over sidebar content) -->
    <div id="add-popover" class="add-popover hidden" aria-hidden="true">
      <div class="add-popover-header">
        <input id="add-search" class="add-search" placeholder="Search…"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="add-close-btn" class="add-close-btn" title="Close">✕</button>
      </div>
      <div id="add-list" class="add-list"></div>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-settings">
        <div class="ctrl-row">
          <span class="ctrl-label">FPS</span>
          <input type="range" id="fps-slider" class="ctrl-slider" min="5" max="30" value="15">
          <span id="fps-val" class="ctrl-value">15</span>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-label">Quality</span>
          <input type="range" id="qual-slider" class="ctrl-slider" min="20" max="95" value="70">
          <span id="qual-val" class="ctrl-value">70</span>
        </div>
        <button id="ds-btn" class="sidebar-btn">Data Saver</button>
      </div>
      <button id="btn-refresh" class="sidebar-btn">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10a6.5 6.5 0 1 0 6.5-6.5H7"/><path d="M7 1.5v4H3"/></svg>
        Refresh
      </button>

      <div id="perms-widget" class="perms-widget hidden">
        <button id="perms-btn" class="perms-btn">
          <span class="perms-dot"></span>
          <span>Enable fast mode</span>
        </button>
        <div id="perms-body" class="perms-body">
          <div id="perms-list"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Content area ──────────────────────────────────────────────────────── -->
  <div id="content">

    <!-- Viewport: sim panels are injected here by JS -->
    <div id="viewport-area">
      <div id="empty-state">
        <div class="empty-icon">📱</div>
        <div class="empty-title">No simulator selected</div>
        <div class="empty-sub">Choose a device from the sidebar</div>
      </div>
      <div id="sim-panels"></div>
    </div>

    <!-- Keyboard bar (shared, applies to focused panel) -->
    <div id="kbd-bar">
      <input id="kbd-input" class="kbd-input" type="text"
             placeholder="Type to send…"
             autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
      <button id="kbd-bs"   class="kbd-key" title="Backspace">⌫</button>
      <button id="kbd-ret"  class="kbd-key" title="Return">↵</button>
      <button id="kbd-send" class="kbd-send">Send</button>
    </div>

    <!-- Bottom tab bar — persistent terminal toggle -->
    <div id="bottom-tab-bar">
      <button id="btn-terminal" class="bottom-tab">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M6 8l3 3-3 3M11 14h3"/></svg>
        Terminal
      </button>
    </div>

    <!-- Terminal panel -->
    <div id="terminal-panel" class="closed">
      <div class="term-resize-handle" id="term-resize-handle"></div>
      <div class="term-body">
        <div class="drawer-handle">
          <div id="term-tabs-bar" class="term-tabs-bar"></div>
          <div class="drawer-actions">
            <div id="term-status-dot" class="status-dot" style="margin-right:4px;"></div>
            <div class="font-size-ctrl">
              <button class="drawer-btn" id="btn-font-dec" title="Decrease font size">A−</button>
              <span id="font-size-val">13</span>
              <button class="drawer-btn" id="btn-font-inc" title="Increase font size">A+</button>
            </div>
            <button class="drawer-btn" id="btn-pin-term" title="Pin to side">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="16" height="16" rx="2"/><path d="M13 2v16"/></svg>
            </button>
            <button class="drawer-btn" id="btn-add-term" title="New terminal" style="font-size:16px;font-weight:300;">+</button>
            <button class="drawer-btn" id="btn-close-term" title="Collapse terminal">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 10 13 16 7"/></svg>
            </button>
          </div>
        </div>
        <div id="term-panes"></div>
      </div>
    </div>

  </div><!-- /content -->

</div><!-- /app -->

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
