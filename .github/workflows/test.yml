name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check simmer/ tests/
      - run: ruff format --check simmer/ tests/

  test:
    name: Test suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test]" aiohttp pyobjc-framework-Quartz

      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/test_rotate.py -v
