[project]
name = "simmer"
version = "0.1.0"
description = "Stream iOS Simulator to your browser with touch, keyboard, and terminal"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyobjc-framework-Quartz",
]

[project.scripts]
simmer = "simmer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simmer"]
